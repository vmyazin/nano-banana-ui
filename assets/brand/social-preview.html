<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Same tokens as app/globals.css — see assets/brand/og-card.html. */
  :root {
    --tint-hue: 190;
    --tint: var(--tint-hue) 60% 85%;
    --background: hsl(var(--tint-hue) 38% 5%);
    --background-elevated: hsl(var(--tint-hue) 32% 8%);
    --foreground: #ecf5f5;
    --foreground-muted: #8fa5a7;
    --neon-cyan: #00fff9;
    --neon-purple: #bd00ff;
    --neon-pink: #ff006e;
    --border: hsl(var(--tint) / 0.075);
    --gradient-primary: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--background); color: var(--foreground);
    font-family: Geist, system-ui, sans-serif; letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased; position: relative; overflow: hidden;
  }
  .grid, .glow { position: absolute; inset: 0; pointer-events: none; }
  .grid {
    background-image:
      linear-gradient(hsl(var(--tint) / 0.022) 1px, transparent 1px),
      linear-gradient(90deg, hsl(var(--tint) / 0.022) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 75%);
  }
  .glow {
    background:
      radial-gradient(60% 50% at 50% -8%, rgba(0, 255, 249, 0.12), transparent 60%),
      radial-gradient(50% 45% at 85% 5%, rgba(189, 0, 255, 0.08), transparent 60%),
      radial-gradient(55% 40% at 8% 100%, rgba(255, 168, 84, 0.07), transparent 65%);
  }
  .stage { position: relative; z-index: 1; height: 100%; padding: 60px 72px 0; }

  /* The lockup the header now uses: wordmark alone, no tile, no repeated name. */
  svg.wordmark { height: 64px; width: auto; fill: var(--foreground); display: block; }

  .cols { display: flex; gap: 56px; margin-top: 66px; }
  .copy { width: 486px; padding-top: 4px; }
  .eyebrow {
    font-family: "Geist Mono", ui-monospace, monospace;
    text-transform: uppercase; letter-spacing: 0.2em;
    font-size: 13px; font-weight: 500; color: var(--foreground-muted);
  }
  h1 { font-size: 64px; font-weight: 600; line-height: 1.02; letter-spacing: -0.035em; margin: 20px 0 22px; }
  .grad { background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 21px; line-height: 1.5; color: var(--foreground-muted); }

  /* Prompt card — the app's glass-card, with the gradient hairline on top. */
  .card {
    position: relative; flex: 1; align-self: flex-start;
    background: var(--background-elevated); border: 1px solid var(--border);
    border-radius: 18px; padding: 28px; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-primary); }
  .field {
    margin-top: 18px; border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; font-size: 19px; line-height: 1.45; color: var(--foreground);
    background: hsl(var(--tint) / 0.02); min-height: 150px;
  }
  .row { display: flex; gap: 9px; margin-top: 18px; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: 15px; color: var(--foreground-muted); }
  .chip.on { background: var(--neon-cyan); border-color: var(--neon-cyan); color: #04191a; font-weight: 600; }
  .cta {
    margin-top: 18px; background: var(--neon-cyan); color: #04191a;
    border-radius: 12px; padding: 18px; text-align: center; font-size: 19px; font-weight: 600;
  }
</style></head>
